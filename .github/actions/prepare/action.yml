name: Prepare the pinned course
description: Restore trusted Lean and targeted Mathlib artifacts; build the locked course
runs:
  using: composite
  steps:
    - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: |
          .tools/lean-4.33.1-linux
          .lake
        key: course-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake*.toml', 'lake-manifest.json', 'League.lean', 'League/*.lean', 'judge/prepare.sh') }}
    - shell: bash
      run: bash judge/prepare.sh
