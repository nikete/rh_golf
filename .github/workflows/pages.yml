name: Withdraw public standings
on:
  push:
    branches: [main]
    paths: ['.github/workflows/pages.yml']
permissions: {}
concurrency:
  group: rh-golf-site
  cancel-in-progress: false
jobs:
  withdraw:
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment: github-pages
    steps:
      - name: Prepare a 404-only site
        run: |
          mkdir public
          echo '<!doctype html><html lang="en"><meta charset="utf-8"><title>Page not found</title><h1>Page not found</h1></html>' > public/404.html
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: public
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
