name: Audit the ordinary RH baseline
on:
  push:
    branches: [main]
    paths:
      - 'judge/baseline/**'
      - 'judge/baseline.json'
      - 'judge/prepare.sh'
      - 'judge/delta_policy.json'
      - 'judge/delta_policy.py'
      - 'judge/delta_checker.py'
      - 'judge/reuse/build.py'
      - 'judge/reuse/index.lock.json'
      - 'judge/reuse/signatures.jsonl.gz'
      - 'judge/archive_graph.lock.json'
      - 'judge/fetch_graph.py'
      - 'lean-toolchain'
      - 'lake-manifest.json'
      - '.github/workflows/baseline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  library:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install the pinned toolchain and dependencies
        run: bash judge/prepare.sh
      - name: Inventory every declaration in the pinned Mathlib
        env:
          MATHLIB_CACHE_GET_URL: https://cache.mathlib.org/mathlib4
        run: |
          export PATH="$PWD/.tools/lean-4.33.1-linux/bin:$PATH"
          lake exe cache get Mathlib
          mkdir -p .out
          lake env lean --run judge/baseline/LibraryNames.lean | gzip -1 > .out/mathlib-names.jsonl.gz
          inventory=$(python3 -c 'import json; print(json.load(open("judge/baseline.json"))["mathlib_inventory_sha256"])')
          printf '%s  %s\n' "$inventory" .out/mathlib-names.jsonl.gz | sha256sum --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pinned-mathlib-names
          path: .out/mathlib-names.jsonl.gz
          if-no-files-found: error
  measure:
    needs: library
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pinned-mathlib-names
          path: .out/baseline
      - name: Trace both the full RH closure and the closure with reflection cut
        shell: bash
        run: |
          url=$(python3 -c 'import json; print(json.load(open("judge/baseline.json"))["export_url"])')
          curl --fail --silent --show-error --location "$url" | bash judge/baseline/reproduce.sh .out/baseline
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ordinary-rh-footprint
          path: .out/baseline/result.json
          if-no-files-found: error
      - name: Reproduce the theorem reuse signatures and dependency footprints
        run: python3 judge/reuse/build.py .out/baseline .out/baseline/signatures.jsonl.gz
      - name: Check exact signatures, statement footprints, and the complete library boundary
        run: |
          python3 judge/baseline/delta_anchor.py .out/baseline judge/reuse/signatures.jsonl.gz > .out/baseline/library-boundary.json
          cat .out/baseline/library-boundary.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: original-rh-library-boundary
          path: .out/baseline/library-boundary.json
          if-no-files-found: error
      - name: Verify graph against pinned per-file digests
        run: python3 judge/fetch_graph.py --verify .out/baseline/archive-graph.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-archive-graph
          path: .out/baseline/archive-graph.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
  publish_graph:
    needs: measure
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: rh-graph-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-archive-graph
          path: .out/release
      - name: Publish and verify the pinned graph release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(python3 judge/fetch_graph.py --tag)
          file=.out/release/archive-graph.tar.gz
          python3 judge/fetch_graph.py --verify "$file"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" "$file" --target "$GITHUB_SHA" --latest=false \
              --title "Audited ordinary RH dependency graph" \
              --notes "Derived from the pinned Lean export. The per-file checksums are recorded in judge/archive_graph.lock.json."
          fi
          gh release download "$tag" --pattern archive-graph.tar.gz --dir .out/published
          python3 judge/fetch_graph.py --verify .out/published/archive-graph.tar.gz
