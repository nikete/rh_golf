name: Judge a proof
on:
  issues:
    types: [opened]
permissions: {}
jobs:
  judge:
    if: startsWith(github.event.issue.title, '[entry] ')
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Select the verifier
        id: entry
        run: python3 judge/run.py --preflight --event "$GITHUB_EVENT_PATH" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/prepare
        if: steps.entry.outputs.needs_lean == 'true'
      - if: steps.entry.outputs.needs_lean == 'true'
        run: docker pull "$(cat judge/image.txt)"
      - name: Check the submitted proof or entrant-generated mathematical witness
        run: python3 judge/run.py --event "$GITHUB_EVENT_PATH" --output .out/receipt.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: receipt
          path: |
            .out/receipt.json
            .out/witness-result.json
            .out/entrant.rhproof.gz
          if-no-files-found: error
  verification_interrupted:
    needs: judge
    if: failure() && needs.judge.result == 'failure'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Link the failed verification
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "Verification was interrupted before a score was available. [Runner log](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID). This run can be retried."
  record:
    needs: judge
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
    outputs:
      accepted: ${{ steps.result.outputs.accepted }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: receipt
          path: .out
      - name: Record the result
        id: result
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          r = json.loads(pathlib.Path(".out/receipt.json").read_text())
          accepted = r["status"] == "accepted"
          if accepted:
              subprocess.run(["python3", "judge/post.py", ".out/receipt.json"], check=True)
              subprocess.run(["bash", "judge/snapshot.sh"], check=True)
              board = json.loads(pathlib.Path("public/scores.json").read_text())
              issue = int(os.environ["ISSUE_NUMBER"])
              entry = next(row for row in board["accepted"] if row["issue"] == issue)
              project = board["provisional_project"]
              gain = entry["provisional_points"]
              summary = (f"**Measured.** Target `{r['hole']}`. "
                         f"Provisional improvement: **{gain:,} nodes** in this snapshot.")
              if "standalone_rh_nodes" in r:
                  summary += f" Standalone RH proof: **{r['standalone_rh_nodes']:,} nodes**."
              if pathlib.Path(".out/witness-result.json").is_file() and any(
                      a["verification_kind"] == "exact-reuse-delta" and issue in a["entries"]
                      for a in board["project"]["audits"]):
                  summary = (f"**Entrant-generated proof verified.** Target `{r['hole']}`. "
                             f"Certified complete RH size: **{r['standalone_rh_nodes']:,} nodes**. "
                             f"Points in this snapshot: **{entry['points']:,}**.")
              if "standalone_rh_nodes" in r and entry["points"] == 0:
                  summary += (" Zero snapshot points can coexist with a gain when combined with the record. "
                              "See [how to measure the combined proof]"
                              "(https://github.com/nikete/rh_golf/blob/main/docs/external-projects.md"
                              "#measuring-a-finding-against-the-record).")
              warning = project.get("bundle_warnings", {}).get(str(issue))
              if warning:
                  summary += f" Optional combination skipped in this snapshot: {warning}."
              owner, repo = os.environ["GITHUB_REPOSITORY"].split("/")
              summary += (f" [Certified records and pending measurements](https://{owner}.github.io/{repo}/). "
                          "The standings show certified points and the verification method.")
          elif r["status"] == "unverified":
              summary = "Verification could not finish on this runner. The entry can be retried.\n\n" + r["reason"]
          else:
              summary = "Entry rejected.\n\n" + "\n".join("    " + line for line in r["reason"].splitlines())
          run = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          pathlib.Path(".out/verdict.md").write_text(summary + f"\n\n[Judge run]({run})")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              print("accepted=" + str(accepted).lower(), file=f)
              print("status=" + r["status"], file=f)
          PY
      - name: Post the verdict on the entry
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue comment "$ISSUE_NUMBER" --body-file .out/verdict.md
      - name: Flag incomplete verification for retry
        if: steps.result.outputs.status == 'unverified'
        run: exit 1
