name: Check course references
on:
  push:
    branches: [main]
    paths:
      - 'League*'
      - 'League/**'
      - 'examples/**'
      - 'judge/**'
      - 'tests/**'
      - 'lake*'
      - 'lean-toolchain'
      - '.github/actions/**'
      - '.github/workflows/course.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare
      - run: python3 -m unittest discover -s tests -v
      - run: docker pull "$(cat judge/image.txt)"
      - name: Judge the examples through the public sandbox
        run: |
          python3 tests/issue_roundtrip.py
          python3 judge/run.py --hole reflection --source examples/reflection.lean --output .out/reflection.json
          python3 - <<'PY'
          import json, pathlib
          for ref in json.load(open("judge/references.json")):
              observed = json.loads(pathlib.Path(f".out/{ref['hole']}.json").read_text())
              for k in ("nodes", "helpers", "axioms", "source_sha256", "certificate_sha256"):
                  assert observed[k] == ref[k], (k, observed, ref)
              print(ref["hole"], observed["nodes"], observed["certificate_sha256"])
          PY
      - name: Reject an admitted proof and a proof of the wrong statement
        run: |
          mkdir -p .out
          for test in admitted wrong-type; do
            if python3 judge/run.py --hole window-logic --source tests/"$test".lean --output .out/"$test".json; then
              echo "Invalid candidate was accepted"; exit 1
            fi
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          for name, expected in (("admitted", "disallowed axiom"), ("wrong-type", "wrong target")):
              result = json.loads(Path(f".out/{name}.json").read_text())
              assert result["status"] == "rejected" and expected in result["reason"], result
          PY
      - name: Measure the original archive on the same reflection hole
        run: |
          curl --fail --location --retry 3 --output .out/RhOfRight.lean \
            https://raw.githubusercontent.com/Deicyde/riemann-hypothesis/40e56bab026552e089d7afcfeff08d2defb9c005/src/Formalism/GammaFactorNonvanishing/RhOfRight.lean
          python3 tests/archive_reflection.py .out/RhOfRight.lean .out/archive-entry.lean
          python3 judge/run.py --hole reflection --source .out/archive-entry.lean --output .out/archive-score.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          before = json.loads(Path(".out/archive-score.json").read_text())
          after = json.loads(Path(".out/reflection.json").read_text())
          assert before["nodes"] == 7404 and before["helpers"] == 2, before
          assert before["certificate_sha256"] == "46177880ee9042095f545854d3b8c5cfa4ac2e97d98c326b4a531b0edb778dcd"
          print(f"Reflection: {before['nodes']:,} → {after['nodes']:,} nodes ({1-after['nodes']/before['nodes']:.1%} smaller).")
          PY
